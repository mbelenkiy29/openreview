services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      # Parsed-file cache keyed by blob SHA; later reviews only parse changed files.
      OPENREVIEW_INDEX_CACHE: /tmp/openreview-index
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,size=2g
